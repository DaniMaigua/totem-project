<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Anteiku</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/config.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/cart.js"></script>
    <script defer src="js/carrito.js"></script>
</head>
<body>
    <header class="header">
        <div class="brand">
            <img src="img/logo-mono.png" alt="Anteiku">
            <div>
                <h1>Anteiku</h1>
                <span class="students">Juan Cruz Reynoso - Daniela Maigua</span>
            </div>
        </div>
        <nav class="menu">
            <a href="carrito.html">Carrito <span class="chip count" id="cartBadge">0</span></a>
            <a href="productos.html">Productos</a>
            <a href="index.html">Bienvenida</a>
            <a href="http://localhost:3000/login">Admin</a>
        </nav>
    </header>

    <main class="page">
        <section class="greeting">
            <h2>Tu carrito</h2>
            <p>Ajusta las cantidades y finaliza la compra</p>
        </section>

        <section id="cartList" class="cart-list"></section>

        <section class="summary">
            <div class="total">
                <span>Total</span>
                <strong id="cartTotal">$ 0.00</strong>
            </div>
            <p id="cartMessage" class="error"></p>
            <button type="button" id="checkoutBtn" class="btn">Finalizar compra</button>
        </section>
    </main>
</body>
</html>
