<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteiku - Autoservicio</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/index.js"></script>
</head>
<body>
    <header class="header">
        <div class="brand">
            <img src="img/logo-mono.png" alt="Anteiku">
            <div>
                <h1>Anteiku</h1>
                <span class="students">Juan Cruz Reynoso - Daniela Maigua</span>
            </div>
        </div>
        <nav class="menu">
            <a href="http://localhost:3000/login">Admin</a>
        </nav>
    </header>

    <main class="page welcome">
        <img src="img/logo-color.png" alt="Anteiku">
        <h2>Bienvenido a Anteiku</h2>
        <p>Cafeteria &amp; Store - autoservicio</p>

        <form id="welcomeForm" class="form">
            <label for="clientName">Ingresa tu nombre para comenzar</label>
            <input type="text" id="clientName" placeholder="Tu nombre" minlength="2" required>
            <button type="submit" class="btn">Continuar</button>
        </form>
    </main>
</body>
</html>
