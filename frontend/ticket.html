<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket - Anteiku</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/config.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/cart.js"></script>
    <script defer src="js/jspdf.umd.min.js"></script>
    <script defer src="js/ticket.js"></script>
</head>
<body>
    <header class="header">
        <div class="brand">
            <img src="img/logo-mono.png" alt="Anteiku">
            <div>
                <h1>Anteiku</h1>
                <span class="students">Juan Cruz Reynoso - Daniela Maigua</span>
            </div>
        </div>
        <nav class="menu">
            <a href="carrito.html">Carrito (<span id="cartBadge">0</span>)</a>
            <a href="productos.html">Productos</a>
            <a href="index.html">Bienvenida</a>
            <a href="http://localhost:3000/login">Admin</a>
        </nav>
    </header>

    <main class="page ticket">
        <h2>Ticket de compra</h2>
        <p class="loading" id="ticketState">Cargando ticket...</p>

        <section id="ticketBody" class="ticket-body" hidden>
            <p class="ticket-line"><span>Venta</span><strong id="saleId"></strong></p>
            <p class="ticket-line"><span>Cliente</span><strong id="saleName"></strong></p>
            <p class="ticket-line"><span>Fecha</span><strong id="saleDate"></strong></p>

            <div id="saleItems" class="ticket-items"></div>

            <p class="ticket-total"><span>Total</span><strong id="saleTotal"></strong></p>
        </section>

        <p id="ticketMessage" class="error"></p>

        <div class="actions">
            <button type="button" id="ticketPdf" class="btn">Descargar PDF</button>
            <a href="productos.html" class="btn">Volver a comprar</a>
        </div>
    </main>
</body>
</html>
